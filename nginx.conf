# Copiaza acest fisier in: /etc/nginx/sites-available/camp-community
# apoi: sudo ln -s /etc/nginx/sites-available/camp-community /etc/nginx/sites-enabled/
# Inlocuieste DOMENIUL_TAU cu domeniul real (ex: campcommunity.ro)

server {
    listen 80;
    server_name DOMENIUL_TAU www.DOMENIUL_TAU;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMENIUL_TAU www.DOMENIUL_TAU;

    # Certificat SSL (generat cu: sudo certbot --nginx -d DOMENIUL_TAU -d www.DOMENIUL_TAU)
    ssl_certificate     /etc/letsencrypt/live/DOMENIUL_TAU/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENIUL_TAU/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
